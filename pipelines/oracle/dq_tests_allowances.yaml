# Data quality tests for ALLOWANCES in the Oracle source. Creates any missing test
# cases (same names as docs/reference.md, so UI-created ones are reused, not
# duplicated) and runs every test on the table.
#   docker exec --env-file .env openmetadata_ingestion metadata test -c /tmp/dqlab-pipelines/oracle/dq_tests_allowances.yaml
source:
  type: testsuite
  serviceName: dqlab_oracle
  sourceConfig:
    config:
      type: TestSuite
      entityFullyQualifiedName: dqlab_oracle.default.dqlab.ALLOWANCES
processor:
  type: orm-test-runner
  config:
    forceUpdate: false
    testCases:
      - name: allowances_type_allowed
        description: Allowance type is HOUSING, TRANSPORT or OTHER.
        testDefinitionName: columnValuesToBeInSet
        columnName: alw_type
        computePassedFailedRowCount: true
        parameterValues:
          - name: allowedValues
            value: "['HOUSING', 'TRANSPORT', 'OTHER']"
          - name: matchEnum
            value: "true"
      - name: allowances_amount_min_0
        description: Allowances are never negative.
        testDefinitionName: columnValuesToBeBetween
        columnName: amount
        computePassedFailedRowCount: true
        parameterValues:
          - name: minValue
            value: "0"
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
