# Profiler for the lab's Oracle source: mirrors the UI's Profiler agent.
#   docker exec --env-file .env openmetadata_ingestion metadata profile -c /tmp/dqlab-pipelines/oracle/profiler.yaml
source:
  type: oracle
  serviceName: dqlab_oracle
  serviceConnection:
    config:
      type: Oracle
      hostPort: source-oracle:1521
      username: ${SOURCE_ORACLE_USER}
      password: ${SOURCE_ORACLE_PASSWORD}
      oracleConnectionType:
        oracleServiceName: XEPDB1
  sourceConfig:
    config:
      type: Profiler
      schemaFilterPattern:
        includes:
          - (?i)^dqlab$
processor:
  type: orm-profiler
  config: {}
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
