# Metadata ingestion for the lab's Oracle source: mirrors the UI's Metadata
# agent on service "dqlab_oracle", views included. Run from the repo root
# (docs/reference.md: "Pipelines from YAML"):
#   docker exec --env-file .env openmetadata_ingestion metadata ingest -c /tmp/dqlab-pipelines/oracle/metadata.yaml
# ${...} placeholders come from .env; the file itself holds no secrets.
source:
  type: oracle
  serviceName: dqlab_oracle
  serviceConnection:
    config:
      type: Oracle
      hostPort: source-oracle:1521
      username: ${SOURCE_ORACLE_USER}
      password: ${SOURCE_ORACLE_PASSWORD}
      oracleConnectionType:
        oracleServiceName: XEPDB1
  sourceConfig:
    config:
      type: DatabaseMetadata
      schemaFilterPattern:
        includes:
          - (?i)^dqlab$
      includeViews: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
