# Data quality tests for SALARIES in the Oracle source. Creates any missing test
# cases (same names as docs/reference.md, so UI-created ones are reused, not
# duplicated) and runs every test on the table.
#   docker exec --env-file .env openmetadata_ingestion metadata test -c /tmp/dqlab-pipelines/oracle/dq_tests_salaries.yaml
source:
  type: testsuite
  serviceName: dqlab_oracle
  sourceConfig:
    config:
      type: TestSuite
      entityFullyQualifiedName: dqlab_oracle.default.dqlab.SALARIES
processor:
  type: orm-test-runner
  config:
    forceUpdate: false
    testCases:
      - name: salaries_base_amount_between_1_and_100000
        description: Base pay is positive and not absurd. The bounds are whole numbers because the UI takes no decimals.
        testDefinitionName: columnValuesToBeBetween
        columnName: base_amount
        computePassedFailedRowCount: true
        parameterValues:
          - name: minValue
            value: "1"
          - name: maxValue
            value: "100000"
      - name: salaries_currency_sar
        description: Everyone is paid in SAR. Oracle compares case-sensitively, so sar fails.
        testDefinitionName: columnValuesToBeInSet
        columnName: currency
        computePassedFailedRowCount: true
        parameterValues:
          - name: allowedValues
            value: "['SAR']"
          - name: matchEnum
            value: "true"
      - name: salaries_no_orphan_emp
        description: Every salary belongs to an existing employee.
        testDefinitionName: tableCustomSQLQuery
        computePassedFailedRowCount: true
        parameterValues:
          - name: sqlExpression
            value: >-
              SELECT s.SAL_ID, s.EMP_ID
              FROM SALARIES s
              LEFT JOIN EMPLOYEES e ON e.EMP_ID = s.EMP_ID
              WHERE e.EMP_ID IS NULL
          - name: strategy
            value: ROWS
          - name: operator
            value: "<="
          - name: threshold
            value: "0"
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
