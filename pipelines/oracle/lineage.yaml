# View lineage for the lab's Oracle source: reads the SQL of V_CURRENT_EMPLOYEES
# and V_MONTHLY_PAYROLL and links each view to the tables it selects from.
# Run it after metadata.yaml, so the views and tables already exist.
#   docker exec --env-file .env openmetadata_ingestion metadata ingest -c /tmp/dqlab-pipelines/oracle/lineage.yaml
source:
  type: oracle-lineage
  serviceName: dqlab_oracle
  serviceConnection:
    config:
      type: Oracle
      hostPort: source-oracle:1521
      username: ${SOURCE_ORACLE_USER}
      password: ${SOURCE_ORACLE_PASSWORD}
      oracleConnectionType:
        oracleServiceName: XEPDB1
  sourceConfig:
    config:
      type: DatabaseLineage
      schemaFilterPattern:
        includes:
          - (?i)^dqlab$
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
