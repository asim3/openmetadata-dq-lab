# Data quality tests for JOB_HISTORY in the Oracle source. Creates any missing test
# cases (same names as docs/reference.md, so UI-created ones are reused, not
# duplicated) and runs every test on the table.
#   docker exec --env-file .env openmetadata_ingestion metadata test -c /tmp/dqlab-pipelines/oracle/dq_tests_job_history.yaml
source:
  type: testsuite
  serviceName: dqlab_oracle
  sourceConfig:
    config:
      type: TestSuite
      entityFullyQualifiedName: dqlab_oracle.default.dqlab.JOB_HISTORY
processor:
  type: orm-test-runner
  config:
    forceUpdate: false
    testCases:
      - name: job_history_end_after_start
        description: A job never ends before it starts. A current job has no END_DATE and is fine.
        testDefinitionName: tableCustomSQLQuery
        computePassedFailedRowCount: true
        parameterValues:
          - name: sqlExpression
            value: >-
              SELECT JH_ID, EMP_ID, START_DATE, END_DATE
              FROM JOB_HISTORY
              WHERE END_DATE < START_DATE
          - name: strategy
            value: ROWS
          - name: operator
            value: "<="
          - name: threshold
            value: "0"
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
