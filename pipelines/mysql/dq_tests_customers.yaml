# Data quality tests for dqlab.customers. Creates any missing test cases (same
# names as the README, so UI-created ones are reused, not duplicated) and runs
# every test on the table.
#   docker exec --env-file .env openmetadata_ingestion metadata test -c /tmp/dqlab-pipelines/mysql/dq_tests_customers.yaml
source:
  type: testsuite
  serviceName: dqlab_mysql
  sourceConfig:
    config:
      type: TestSuite
      entityFullyQualifiedName: dqlab_mysql.default.dqlab.customers
processor:
  type: orm-test-runner
  config:
    forceUpdate: false
    testCases:
      - name: customers_full_name_not_null
        description: Every customer has a name.
        testDefinitionName: columnValuesToBeNotNull
        columnName: full_name
        computePassedFailedRowCount: true
      - name: customers_email_unique
        description: No two customers share an email. Both copies of a duplicate count as failed rows.
        testDefinitionName: columnValuesToBeUnique
        columnName: email
        computePassedFailedRowCount: true
      - name: customers_email_format
        description: Emails look like name@domain.tld.
        testDefinitionName: columnValuesToMatchRegex
        columnName: email
        computePassedFailedRowCount: true
        parameterValues:
          - name: regex
            value: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}$"
      - name: customers_age_between_18_and_90
        description: Customers are adults of a plausible age.
        testDefinitionName: columnValuesToBeBetween
        columnName: age
        computePassedFailedRowCount: true
        parameterValues:
          - name: minValue
            value: "18"
          - name: maxValue
            value: "90"
      - name: customers_country_allowed
        description: Country is one of the ISO codes the shop serves. matchEnum makes every row count, not just one.
        testDefinitionName: columnValuesToBeInSet
        columnName: country
        computePassedFailedRowCount: true
        parameterValues:
          - name: allowedValues
            value: "['SA', 'AE', 'KW', 'EG', 'QA', 'BH', 'OM', 'JO', 'GB', 'US']"
          - name: matchEnum
            value: "true"
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
