# Data quality tests for dqlab.products. Creates any missing test cases (same
# names as docs/reference.md, so UI-created ones are reused, not duplicated) and runs
# every test on the table.
#   docker exec --env-file .env openmetadata_ingestion metadata test -c /tmp/dqlab-pipelines/mysql/dq_tests_products.yaml
source:
  type: testsuite
  serviceName: dqlab_mysql
  sourceConfig:
    config:
      type: TestSuite
      entityFullyQualifiedName: dqlab_mysql.default.dqlab.products
processor:
  type: orm-test-runner
  config:
    forceUpdate: false
    testCases:
      - name: products_sku_unique
        description: Every product has its own SKU. Both copies of a duplicate count as failed rows.
        testDefinitionName: columnValuesToBeUnique
        columnName: sku
        computePassedFailedRowCount: true
      - name: products_unit_price_min_1
        description: Prices are positive. The bound is 1 because the UI takes whole numbers; the lab never prices below 1.00.
        testDefinitionName: columnValuesToBeBetween
        columnName: unit_price
        computePassedFailedRowCount: true
        parameterValues:
          - name: minValue
            value: "1"
      - name: products_category_not_null
        description: Every product has a category.
        testDefinitionName: columnValuesToBeNotNull
        columnName: category
        computePassedFailedRowCount: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
