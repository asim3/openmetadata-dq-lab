# Auto classification for the lab's MySQL source: mirrors the UI's Auto
# Classification agent with "Store Sample Data" on. In OpenMetadata 2.x this
# is the pipeline that fills the Sample Data tab.
# PII tagging (enableAutoClassification) is off: it downloads a spaCy model
# from GitHub on first use, which TLS-inspecting networks block.
#   docker exec --env-file .env openmetadata_ingestion metadata classify -c /tmp/dqlab-pipelines/mysql/auto_classification.yaml
source:
  type: mysql
  serviceName: dqlab_mysql
  serviceConnection:
    config:
      type: Mysql
      hostPort: source-mysql:3306
      username: ${SOURCE_MYSQL_USER}
      authType:
        password: ${SOURCE_MYSQL_PASSWORD}
      databaseSchema: dqlab
  sourceConfig:
    config:
      type: AutoClassification
      storeSampleData: true
      enableAutoClassification: false
processor:
  type: orm-profiler
  config: {}
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
