# Profiler for the lab's MySQL source: mirrors the UI's Profiler agent.
#   docker exec --env-file .env openmetadata_ingestion metadata profile -c /tmp/dqlab-pipelines/mysql/profiler.yaml
source:
  type: mysql
  serviceName: dqlab_mysql
  serviceConnection:
    config:
      type: Mysql
      hostPort: source-mysql:3306
      username: ${SOURCE_MYSQL_USER}
      authType:
        password: ${SOURCE_MYSQL_PASSWORD}
      databaseSchema: dqlab
  sourceConfig:
    config:
      type: Profiler
processor:
  type: orm-profiler
  config: {}
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${DQLAB_INGESTION_BOT_JWT}
